site_name: Maria Luiza Sevilha | Neural Networks
site_description: Course portfolio for Artificial Neural Networks and Deep Learning (Insper, 2026.2)
site_url: https://malusevilha.github.io/neural-networks/
repo_url: https://github.com/MaluSevilha/neural-networks
repo_name: MaluSevilha/neural-networks
edit_uri: ""

theme:
  name: material
  language: en
  favicon: favicon.svg
  icon:
    logo: material/brain
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mathjax.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Exercises:
      - Overview: exercises/index.md
      - 1. Data: exercises/data/index.md
      - 2. Perceptron: exercises/perceptron/index.md
      - 3. MLP: exercises/mlp/index.md
  - Projects:
      - Overview: projects/index.md
  - About: about.md