site_name: Maria Luiza Sevilha | Neural Networks
site_description: Course portfolio for Artificial Neural Networks and Deep Learning (Insper, 2026.2)
site_url: https://malusevilha.github.io/neural-networks/
repo_url: https://github.com/MaluSevilha/neural-networks
repo_name: MaluSevilha/neural-networks
edit_uri: ""

theme:
  name: simplex
  language: en
  favicon: assets/favicon.svg

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Exercises:
      - Data: exercises/data/index.md
      - Perceptron: exercises/perceptron/index.md
      - Multi-Layer Perceptron: exercises/mlp/index.md
      - VAE: exercises/vae/index.md
  - Projects:
      - Overview: projects/index.md
  - About: about.md